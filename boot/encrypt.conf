# Read after mkinitcpio.conf on an encrypted install. Unlocks the root before
# filesystems: sd-encrypt with systemd-based hooks, encrypt with udev-based ones.
_yunagi_unlock=encrypt
for _yunagi_hook in "${HOOKS[@]}"; do
    [ "$_yunagi_hook" = systemd ] && _yunagi_unlock=sd-encrypt
done
_yunagi_hooks=()
for _yunagi_hook in "${HOOKS[@]}"; do
    case $_yunagi_hook in
        encrypt|sd-encrypt) continue ;;
        filesystems) _yunagi_hooks+=("$_yunagi_unlock") ;;
    esac
    _yunagi_hooks+=("$_yunagi_hook")
done
HOOKS=("${_yunagi_hooks[@]}")
unset _yunagi_hooks _yunagi_hook _yunagi_unlock
