# Read after mkinitcpio.conf. Keep the user's hooks and insert Plymouth before
# unlocking or mounting the root filesystem, after keyboard and graphics setup.
_yunagi_hooks=()
_yunagi_inserted=no
for _yunagi_hook in "${HOOKS[@]}"; do
    [ "$_yunagi_hook" = plymouth ] && continue
    case $_yunagi_hook in
        encrypt|sd-encrypt|filesystems)
            if [ "$_yunagi_inserted" = no ]; then
                _yunagi_hooks+=(plymouth)
                _yunagi_inserted=yes
            fi ;;
    esac
    _yunagi_hooks+=("$_yunagi_hook")
done
HOOKS=("${_yunagi_hooks[@]}")
unset _yunagi_hooks _yunagi_hook _yunagi_inserted
