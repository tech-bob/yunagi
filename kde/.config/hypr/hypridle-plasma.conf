# Plasma: only the screensaver. KDE locks (kscreenlockerrc) and turns screens off (powerdevilrc).

# Screensaver
listener {
    timeout = 300
    # Not while an app holds KDE's screen inhibition (fullscreen video in a browser)
    on-timeout = pgrep -x kscreenlocker_greet || gdbus call --session --dest org.kde.Solid.PowerManagement --object-path /org/kde/Solid/PowerManagement/PolicyAgent --method org.kde.Solid.PowerManagement.PolicyAgent.HasInhibition 4 | grep -q true || ~/.local/bin/yunagi-screensaver
}

# Closed when KDE locks
listener {
    timeout = 600
    on-timeout = pkill -f 'yunagi-screensave[r] --run'
}
