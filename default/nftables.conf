#!/usr/sbin/nft -f
# Yunagi firewall: incoming dropped except replies, loopback and basic ICMP;
# outgoing open. To open a port, add a line to the input chain, e.g.
#   tcp dport 22 accept comment "SSH"
# then save; the settings menu reloads it (or: sudo systemctl restart nftables).

# Only this table is replaced, so tables set up by others (WireGuard, VMs) stay
add table inet filter
flush table inet filter

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state invalid drop
		ct state established,related accept

		# Basic ICMP; IPv6 does not work without it
		icmp type { echo-request, destination-unreachable, time-exceeded } accept
		icmpv6 type { echo-request, destination-unreachable, time-exceeded, packet-too-big, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
