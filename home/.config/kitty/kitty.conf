# --- Font ---
font_family      Hack Nerd Font
font_size        13.0

# --- Window ---
background_opacity   1.0
dynamic_background_opacity yes
window_padding_width 8
scrollback_lines     10000
enable_audio_bell    no

# --- Colors (muted dark base) ---
foreground  #d0d0d0
background  #101010
cursor      #d0d0d0

# --- Tabs ---
map ctrl+t  new_tab
map ctrl+w  close_tab
map alt+1   goto_tab 1
map alt+2   goto_tab 2
map alt+3   goto_tab 3
map alt+4   goto_tab 4
map alt+5   goto_tab 5
map alt+6   goto_tab 6
map alt+7   goto_tab 7

# --- Other ---
map ctrl+shift+r     load_config_file
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+c     copy_to_clipboard
map ctrl+shift+v     paste_from_clipboard


# --- Tab bar ---
tab_bar_edge            top
tab_bar_style           fade
tab_fade                0.25 0.5 0.75 1
tab_bar_background      #101010
tab_title_max_length    30
tab_bar_min_tabs        2
tab_title_template      "{(fmt.bg._ff9e64 + fmt.fg._101010) if tab.active_exe == 'ssh' else ''} {index} {title} "
active_tab_title_template "▏{(fmt.bg._ff9e64 + fmt.fg._101010) if tab.active_exe == 'ssh' else ''}{index} {title}{fmt.bg.tab}{fmt.fg.tab}▕"

active_tab_foreground   #7aa2f7
active_tab_background   #101010
active_tab_font_style   bold
inactive_tab_foreground #707070
inactive_tab_background #101010

# Colors from matugen if present
globinclude matugen.conf
