[config]

# Read by Yunagi's Quickshell (Colors.qml)
[templates.quickshell]
input_path = "~/.config/matugen/templates/colors.json"
output_path = "~/.local/state/yunagi/colors.json"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-4.0/yunagi-colors.css"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-3.0/yunagi-colors.css"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/matugen.conf"
post_hook = "pkill -USR1 -x kitty"
