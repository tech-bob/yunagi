general {
    lock_cmd = pgrep -x hyprlock || hyprlock
    on_lock_cmd = sleep 5; pgrep -x hyprlock && hyprctl dispatch 'hl.dsp.dpms({action = "disable"})'
    on_unlock_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "enable"})'
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "enable"})'
}

# Screensaver
listener {
    timeout = 300
    on-timeout = ~/.local/bin/yunagi-screensaver
}

# Automatic lock
listener {
    timeout = 600
    on-timeout = pkill -f 'yunagi-screensave[r] --run'; loginctl lock-session
}

# Screen power
listener {
    timeout = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "disable"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "enable"})'
}

# Locked and woken: screens off again after 10 s
listener {
    timeout = 10
    on-timeout = pgrep -x hyprlock && hyprctl dispatch 'hl.dsp.dpms({action = "disable"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "enable"})'
}
