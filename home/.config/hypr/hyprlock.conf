# Yunagi lock style: Glass
$sans = Noto Sans
$text = rgb(244, 244, 242)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = smooth, 0.2, 0, 0, 1
    animation = fadeIn, 1, 6, smooth
    animation = fadeOut, 1, 6, smooth
    animation = inputFieldDots, 1, 2, smooth
}

background {
    monitor =
    color = rgba(12, 24, 32, 1.0000)
    path = ~/Pictures/wallpapers/jonatan-pie-3l3RwQdHRHg-unsplash.jpg
    blur_passes = 3
    blur_size = 7
}

shape {
    monitor =
    size = 100%, 100%
    color = rgba(0, 0, 0, 0.2667)
    rounding = 0
    border_size = 0
    border_color = rgba(0, 0, 0, 0)
    zindex = 0
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = <span weight="300">$TIME</span>
    color = rgba(244, 246, 250, 1.0000)
    font_family = Noto Sans
    font_size = 64
    shadow_passes = 2
    shadow_size = 4
    zindex = 2
    position = 0, 240
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=C date +"%A, %-d %B"
    color = rgba(184, 197, 212, 1.0000)
    font_family = Noto Sans
    font_size = 17
    shadow_passes = 2
    shadow_size = 3
    zindex = 2
    position = 0, 150
    halign = center
    valign = center
}

# Greeting by time of day, in the middle of the screen
label {
    monitor =
    text = cmd[update:60000] ~/.local/bin/yunagi-greeting
    color = rgba(232, 238, 245, 0.9500)
    font_family = Noto Serif
    font_size = 26
    shadow_passes = 2
    shadow_size = 3
    zindex = 2
    position = 0, 0
    halign = center
    valign = center
}

# Caps Lock warning over the password field
label {
    monitor =
    text = cmd[update:500] grep -qs 1 /sys/class/leds/*::capslock/brightness && echo "Caps Lock is on"
    color = rgb(251, 191, 36)
    font_family = Noto Sans
    font_size = 13
    shadow_passes = 2
    shadow_size = 3
    zindex = 2
    position = 0, -255
    halign = center
    valign = center
}

# Battery, bottom right; empty on a computer without one
label {
    monitor =
    text = cmd[update:30000] ~/.local/bin/yunagi-battery
    color = rgba(184, 197, 212, 0.8500)
    font_family = Noto Sans
    font_size = 13
    shadow_passes = 2
    shadow_size = 3
    zindex = 2
    position = -40, 30
    halign = right
    valign = bottom
}

input-field {
    monitor =
    size = 420, 64
    outline_thickness = 1
    rounding = 0
    inner_color = rgba(7, 13, 22, 0.4510)
    outer_color = rgba(124, 154, 181, 0.3765)
    check_color = rgba(125, 211, 252, 0.8)
    fail_color = rgb(248, 113, 113)
    capslock_color = rgba(251, 191, 36, 0.8)
    font_color = rgba(237, 244, 250, 1.0000)
    font_family = Noto Sans
    placeholder_text = Password for $USER
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.45
    zindex = 3
    position = 0, -310
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.config/hypr/lock/wordmark.png
    size = 57
    rounding = 0
    border_size = 0
    zindex = 2
    position = 0, -415
    halign = center
    valign = center
}
